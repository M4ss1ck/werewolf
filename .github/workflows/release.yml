name: Release

on:
  push:
    tags:
      - "v*"
  # No version input on purpose. Each build job checks out the repo fresh, so a
  # bump made here would live only in the prepare job's workspace and the
  # artifacts would ship the old version under the new tag. Bump with
  # ./scripts/release.sh, which commits it, then push the tag. A bare dispatch
  # re-runs the build for whatever is already committed.
  workflow_dispatch:

jobs:
  # Resolve the version and release notes once, and refuse to build a
  # half-bumped tree where the version files disagree.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.notes }}
    steps:
      # The desktop and Android clients bake their server origin in at build
      # time. Empty ships artifacts that resolve /api against tauri://localhost
      # and reach nothing — no error on screen, no failing job, just a release
      # nobody can sign in to. Check it before a single artifact is built.
      - name: Verify the client has a server origin
        env:
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        run: |
          if [ -z "$VITE_SERVER_ORIGIN" ]; then
            echo "::error::VITE_SERVER_ORIGIN is not set. Set the repository variable (Settings > Secrets and variables > Actions > Variables) to the deployed server origin, e.g. https://werewolf.example.com"
            exit 1
          fi
          case "$VITE_SERVER_ORIGIN" in
            https://*|http://*) ;;
            *)
              echo "::error::VITE_SERVER_ORIGIN must be an absolute origin including the scheme, got '$VITE_SERVER_ORIGIN'"
              exit 1
              ;;
          esac
          echo "Clients in this release will talk to $VITE_SERVER_ORIGIN"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -Po '"version":\s*"\K[^"]+' package.json | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Extract changelog notes
        id: changelog
        run: |
          # Pull the top (latest) section from CHANGELOG.md, dropping the version
          # header line. Falls back to empty if CHANGELOG.md is missing, in which
          # case the release steps use GitHub's auto-generated notes.
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/{c++} c==1' CHANGELOG.md | tail -n +2)
          else
            NOTES=""
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify versions are in sync
        run: |
          PKG_VERSION=$(grep -Po '"version":\s*"\K[^"]+' package.json | head -1)
          TAURI_VERSION=$(grep -Po '"version":\s*"\K[^"]+' apps/client/src-tauri/tauri.conf.json | head -1)
          CARGO_VERSION=$(grep -Po '^version = "\K[^"]+' apps/client/src-tauri/Cargo.toml | head -1)

          echo "package.json version: $PKG_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ "$PKG_VERSION" != "$TAURI_VERSION" ]] || [[ "$PKG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "Error: Version mismatch detected!"
            echo "Run './scripts/bump-version.sh $PKG_VERSION' to sync versions."
            exit 1
          fi

          # Workspace members do not affect the built artifacts, but a release is
          # one version across the repo, so drift here is still a failed release.
          MISMATCHED=0
          for manifest in apps/*/package.json packages/*/package.json; do
            [ -f "$manifest" ] || continue
            WS_VERSION=$(grep -Po '"version":\s*"\K[^"]+' "$manifest" | head -1)
            echo "$manifest version: $WS_VERSION"
            if [[ "$WS_VERSION" != "$PKG_VERSION" ]]; then
              echo "Error: $manifest is $WS_VERSION, expected $PKG_VERSION"
              MISMATCHED=1
            fi
          done
          if [[ "$MISMATCHED" != "0" ]]; then
            echo "Run './scripts/bump-version.sh $PKG_VERSION' to sync versions."
            exit 1
          fi

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run check

  # Build for Linux (deb, rpm, appimage)
  build-linux:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/client/src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The packaged client bakes its server origin in at build time, so a
      # desktop bundle built without it reaches nothing. Set the
      # VITE_SERVER_ORIGIN repository variable to the deployed server origin.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        with:
          projectPath: apps/client
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "Werewolf v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Upload Linux artifacts for Arch build
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-artifacts
          path: |
            apps/client/src-tauri/target/x86_64-unknown-linux-gnu/release/werewolf
            apps/client/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/
            apps/client/src-tauri/icons/128x128.png
          retention-days: 1

  # Build for Windows using GNU toolchain, cross-compiled from Linux
  build-windows:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            nsis \
            llvm \
            clang \
            lld \
            libappindicator3-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/client/src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The packaged client bakes its server origin in at build time, so a
      # desktop bundle built without it reaches nothing. Set the
      # VITE_SERVER_ORIGIN repository variable to the deployed server origin.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        with:
          projectPath: apps/client
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "Werewolf v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-gnu

  # Build signed per-ABI Android APKs (separate arm64-v8a and x86_64)
  build-android:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0" "platforms;android-36" "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/client/src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in repo secrets."
            exit 1
          fi
          SIGNING_DIR="$HOME/.config/werewolf/android-signing"
          KEYSTORE="$SIGNING_DIR/android-release.jks"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            printf 'WEREWOLF_ANDROID_KEYSTORE=%q\n' "$KEYSTORE"
            printf 'WEREWOLF_ANDROID_KEY_ALIAS=%q\n' "$ANDROID_KEY_ALIAS"
            printf 'WEREWOLF_ANDROID_KEYSTORE_PASSWORD=%q\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > "$SIGNING_DIR/credentials.env"
          chmod 600 "$KEYSTORE" "$SIGNING_DIR/credentials.env"

      # The client bakes the server origin in at build time, so a CI APK built
      # without it ships unable to reach anything. Set the VITE_SERVER_ORIGIN
      # repository variable to the deployed server origin.
      - name: Build signed Android APK
        env:
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        run: bun run build:android

      - name: Rename APKs to release filenames
        id: apk
        run: |
          APK_DIR="apps/client/src-tauri/gen/android/app/build/outputs/apk"
          VERSION="${{ needs.prepare.outputs.version }}"
          cp "$APK_DIR/arm64/release/werewolf-arm64-v8a.apk" "werewolf_${VERSION}_android_arm64-v8a.apk"
          cp "$APK_DIR/x86_64/release/werewolf-x86_64.apk" "werewolf_${VERSION}_android_x86_64.apk"

      - name: Upload Android APKs to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            werewolf_${{ needs.prepare.outputs.version }}_android_arm64-v8a.apk
            werewolf_${{ needs.prepare.outputs.version }}_android_x86_64.apk
          tag_name: v${{ needs.prepare.outputs.version }}
          draft: true
          body: ${{ needs.prepare.outputs.changelog }}
          generate_release_notes: ${{ needs.prepare.outputs.changelog == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the server container (werewolf ships a SPA + API in one image)
  build-docker:
    needs: [prepare, quality]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build Arch Linux package using Docker
  build-arch:
    needs: [prepare, quality, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-build-artifacts
          path: apps/client/src-tauri

      - name: Restore executable permission
        run: |
          chmod +x apps/client/src-tauri/target/x86_64-unknown-linux-gnu/release/werewolf

      - name: Build Arch Linux package
        run: |
          chmod +x ./scripts/build-arch-package.sh
          ./scripts/build-arch-package.sh

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v3
        with:
          files: apps/client/src-tauri/target/release/bundle/arch/*.pkg.tar.zst
          tag_name: v${{ needs.prepare.outputs.version }}
          draft: true
          body: ${{ needs.prepare.outputs.changelog }}
          generate_release_notes: ${{ needs.prepare.outputs.changelog == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
