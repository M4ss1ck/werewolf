[package]
name = "app"
version = "0.1.9"
description = "Server-authoritative live social deduction game"
authors = ["Andy Palmero"]
license = "MIT"
repository = "https://github.com/M4ss1ck/werewolf"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
# Parsing the loopback callback target by hand is exactly where a silent
# percent-decoding bug would live; this is already in the tree via deep-link.
url = "2"

# Desktop only. Without this the OS starts a second instance to deliver a
# werewolf:// deep link, and the window the user is looking at never sees it.
# The deep-link feature forwards the URL to the already-running instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
