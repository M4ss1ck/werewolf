# Development stack. Run with:
#
#   docker compose -f docker-compose.dev.yml up
#
# The API is on http://localhost:3000 and the Vite dev server on
# http://localhost:1420. Use the Vite URL while developing: it hot-reloads and
# proxies /api to the server.
#
# The database is a local libSQL file under ./data, so no Turso account is
# needed to develop. Point TURSO_DATABASE_URL at a real Turso URL when you want
# to work against the hosted database instead.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Development only: the container shares a workstation with the editor and
    # the browser, so a runaway build or watch loop must not be able to starve
    # the desktop. Production sets its own limits at the deployment level.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    env_file:
      - .env
    environment:
      PORT: 3000
      # Overrides .env so the container writes inside its own volume.
      TURSO_DATABASE_URL: file:/app/data/werewolf.db
      TURSO_AUTH_TOKEN: ""
      BETTER_AUTH_URL: http://localhost:3000
      # Browser requests arrive through Vite, so Better Auth must accept the
      # development page origin in addition to its API base URL.
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:1420
      # Lets the Vite dev server reach the API from inside the container.
      VITE_SERVER_ORIGIN: http://localhost:3000
      # Bind mounts do not deliver inotify events; poll instead.
      VITE_POLL: "1"
      # The Vite plugin bakes a pairing token into the page, minting one in its
      # own $HOME when it finds none. Inside the container that is not the
      # token the host's Reticle daemon expects, so the browser is refused with
      # "authentication failed". Point the plugin at the host's token instead.
      RETICLE_PAIRING_TOKEN_DIR: /reticle-host
    ports:
      - "3000:3000"
      - "1420:1420"
    # Reconcile dependencies with the lockfile on every boot, then serve. A
    # no-op in milliseconds when they already match, so this costs nothing in
    # the steady state and makes a stale container impossible. --frozen-lockfile
    # is load-bearing twice over: it fails loudly on a manifest the lockfile
    # does not cover, and it guarantees nothing writes bun.lock back into the
    # bind mount as root.
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    volumes:
      # Live source, so edits on the host reload in the container.
      - .:/app
      # Dependencies live here and nowhere else. Bun installs a workspace's
      # links into that workspace's OWN node_modules, not into the root one, so
      # every one of them needs a volume or the bind mount above hides it.
      #
      # NAMED, not anonymous, and filled by the `command:` below rather than by
      # the image. Anonymous volumes survive container recreation, so baking
      # dependencies into the image gave two sources of truth with the stale
      # one winning: `--build` could not reach a running container and you got
      # "Cannot find module" until you also remembered --renew-anon-volumes.
      # Installing at boot makes the lockfile the only authority.
      - deps-root:/app/node_modules
      - deps-client:/app/apps/client/node_modules
      - deps-server:/app/apps/server/node_modules
      - deps-protocol:/app/packages/protocol/node_modules
      - deps-game-engine:/app/packages/game-engine/node_modules
      - deps-db:/app/packages/db/node_modules
      - deps-i18n:/app/packages/i18n/node_modules
      # Persist the development database across restarts.
      - ./data:/app/data
      # Read-only: the plugin only needs to read the host's pairing token.
      - ${HOME}/.reticle:/reticle-host:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  deps-root:
  deps-client:
  deps-server:
  deps-protocol:
  deps-game-engine:
  deps-db:
  deps-i18n:
