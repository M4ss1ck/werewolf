# One app service. No local DB container, no Redis, no scheduler container, no
# frontend container, no WebSocket sidecar.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Do not scale beyond one replica without adding cross-process coordination
    # and event fanout first.
    deploy:
      replicas: 1
    ports:
      - "${PORT:-3000}:3000"
    # Every variable from .env, so adding one to .env.example never means
    # editing this file too. Listing them explicitly was both a maintenance
    # burden and a trap: an unset ${VAR} resolves to an EMPTY STRING rather than
    # being absent, and an empty string defeats a schema default — the bot
    # settings would have come up with BOT_MIN_DELAY_MS=0, and
    # BOT_MAX_CONCURRENT_CALLS would fail its positive() check and stop the
    # server booting at all.
    env_file:
      - .env
    environment:
      # The container always listens on 3000. ${PORT} chooses only the host side
      # of the mapping below, so it must not reach the process itself.
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
